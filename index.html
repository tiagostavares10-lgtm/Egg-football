<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Football - O Jogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Menu Inicial -->
        <div id="menuInicial" class="menu-screen active">
            <h1>⚽ EGG FOOTBALL ⚽</h1>
            <p class="subtitle">Escolhe o modo de jogo</p>
            <div class="button-group">
                <button class="menu-btn" onclick="initGameMode('casual')">🎮 CASUAL</button>
                <button class="menu-btn" onclick="initGameMode('ranked')">🏆 RANQUEADA</button>
                <button class="menu-btn" onclick="initGameMode('training')">🎯 TREINO</button>
            </div>
        </div>

        <!-- Seleção de Modo (1v1, 2v2, etc) -->
        <div id="modeSelection" class="menu-screen">
            <h1>⚽ Escolhe o número de jogadores</h1>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame(1)">1v1</button>
                <button class="menu-btn" onclick="startGame(2)">2v2</button>
                <button class="menu-btn" onclick="startGame(3)">3v3</button>
                <button class="menu-btn" onclick="startGame(4)">4v4</button>
                <button class="menu-btn" onclick="startGame(5)">5v5</button>
            </div>
            <button class="back-btn" onclick="backToMenu()">← Voltar</button>
        </div>

        <!-- Jogo -->
        <div id="gameContainer" class="game-screen">
            <div class="game-header">
                <div class="team-score">
                    <span class="team-name team1-name">TEAM 1</span>
                    <span class="score" id="score1">0</span>
                </div>
                <div class="timer">
                    <span id="timer">3:00</span>
                </div>
                <div class="team-score">
                    <span class="score" id="score2">0</span>
                    <span class="team-name team2-name">TEAM 2</span>
                </div>
            </div>

            <canvas id="gameCanvas" width="1000" height="600"></canvas>

            <div class="game-controls">
                <button class="control-btn shoot-btn" id="shootBtn" onclick="shootBall()">🔥 CHUTAR</button>
                <button class="control-btn pass-btn" id="passBtn" onclick="passBall()">➡️ PASS</button>
            </div>

            <div class="game-info" id="gameInfo"></div>
        </div>

        <!-- Tela de Fim de Jogo -->
        <div id="gameOver" class="menu-screen">
            <h1 id="gameOverTitle">JOGO TERMINADO!</h1>
            <p id="gameOverMessage"></p>
            <p id="pointsChange"></p>
            <div class="button-group">
                <button class="menu-btn" onclick="backToMenu()">← Menu Principal</button>
                <button class="menu-btn" onclick="playAgain()">🔄 Jogar Novamente</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
